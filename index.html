<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serial ↔ Gemini Bridge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --bg:       #080c10;
    --surface:  #0d1117;
    --border:   #1e2d40;
    --accent:   #00d4ff;
    --accent2:  #00ff9d;
    --warn:     #ff6b35;
    --text:     #c9d8e8;
    --dim:      #4a6070;
    --glow:     0 0 12px rgba(0,212,255,0.4);
    --glow2:    0 0 12px rgba(0,255,157,0.4);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* Grid background */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(13,17,23,0.85);
    backdrop-filter: blur(8px);
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 1.15rem;
    color: var(--accent);
    letter-spacing: 3px;
    text-shadow: var(--glow);
  }

  .logo span { color: var(--accent2); text-shadow: var(--glow2); }

  header .spacer { flex: 1; }

  #status-badge {
    font-size: 0.7rem;
    letter-spacing: 2px;
    padding: 4px 12px;
    border-radius: 2px;
    border: 1px solid var(--dim);
    color: var(--dim);
    transition: all 0.3s;
    text-transform: uppercase;
  }
  #status-badge.connected {
    border-color: var(--accent2);
    color: var(--accent2);
    box-shadow: var(--glow2);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  main {
    position: relative;
    z-index: 10;
    flex: 1;
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: 1fr;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  aside {
    border-right: 1px solid var(--border);
    background: rgba(13,17,23,0.7);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow-y: auto;
  }

  .section-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 0.68rem;
    letter-spacing: 1.5px;
    color: var(--dim);
    text-transform: uppercase;
  }

  input, select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.82rem;
    padding: 8px 10px;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    width: 100%;
  }
  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,212,255,0.1);
  }

  .btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 14px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    width: 100%;
  }
  .btn:hover:not(:disabled) {
    background: rgba(0,212,255,0.08);
    box-shadow: var(--glow);
  }
  .btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .btn.danger {
    border-color: var(--warn);
    color: var(--warn);
  }
  .btn.danger:hover:not(:disabled) {
    background: rgba(255,107,53,0.08);
    box-shadow: 0 0 12px rgba(255,107,53,0.4);
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .stat-box {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px;
    border-radius: 2px;
  }
  .stat-box .val {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    color: var(--accent);
    text-shadow: var(--glow);
  }
  .stat-box .key {
    font-size: 0.6rem;
    letter-spacing: 1px;
    color: var(--dim);
    margin-top: 2px;
  }

  /* ── Chat area ── */
  .chat-wrap {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  #log::-webkit-scrollbar { width: 4px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: fadeUp 0.25s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 0.65rem;
    letter-spacing: 1px;
    color: var(--dim);
  }
  .msg-meta .tag {
    padding: 1px 7px;
    border-radius: 1px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.58rem;
    letter-spacing: 2px;
  }
  .tag-device { background: rgba(0,212,255,0.12); color: var(--accent); border: 1px solid rgba(0,212,255,0.3); }
  .tag-gemini { background: rgba(0,255,157,0.12); color: var(--accent2); border: 1px solid rgba(0,255,157,0.3); }
  .tag-system { background: rgba(74,96,112,0.2); color: var(--dim); border: 1px solid rgba(74,96,112,0.3); }
  .tag-error  { background: rgba(255,107,53,0.12); color: var(--warn); border: 1px solid rgba(255,107,53,0.3); }

  .msg-body {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 2px;
    font-size: 0.83rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 820px;
  }
  .msg.device .msg-body { border-left: 2px solid var(--accent); }
  .msg.gemini .msg-body { border-left: 2px solid var(--accent2); }
  .msg.error  .msg-body { border-left: 2px solid var(--warn); color: var(--warn); }

  /* Typing indicator */
  .typing .msg-body {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 14px;
  }
  .dot {
    width: 6px; height: 6px;
    background: var(--accent2);
    border-radius: 50%;
    animation: blink 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%,80%,100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  .chat-footer {
    border-top: 1px solid var(--border);
    padding: 14px 24px;
    background: rgba(13,17,23,0.85);
    backdrop-filter: blur(8px);
    font-size: 0.72rem;
    color: var(--dim);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .chat-footer .indicator {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--dim);
    transition: background 0.3s;
  }
  .chat-footer .indicator.active { background: var(--accent2); box-shadow: var(--glow2); }

  /* Scrollbar for aside */
  aside::-webkit-scrollbar { width: 3px; }
  aside::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>

<header>
  <div class="logo">SERIAL<span>↔</span>GEMINI</div>
  <div class="spacer"></div>
  <div id="status-badge">DISCONNECTED</div>
</header>

<main>
  <aside>
    <div>
      <div class="section-label">Connection</div>

      <div class="field" style="margin-bottom:10px">
        <label>Baud Rate</label>
        <select id="baud">
          <option>9600</option>
          <option>19200</option>
          <option>38400</option>
          <option>57600</option>
          <option>115200</option>
        </select>
      </div>

      <div class="field" style="margin-bottom:14px">
        <label>Chunk Size (bytes)</label>
        <input id="chunk" type="number" value="63" min="1" max="512">
      </div>

      <button class="btn" id="btn-connect">▶ SELECT PORT</button>
      <div style="height:8px"></div>
      <button class="btn danger" id="btn-disconnect" disabled>■ DISCONNECT</button>
    </div>

    <div>
      <div class="section-label">Gemini</div>
      <div class="field" style="margin-bottom:10px">
        <label>API Key</label>
        <input id="apikey" type="password" placeholder="AIza…">
      </div>
      <div class="field">
        <label>Model</label>
        <select id="model">
          <option value="gemini-2.5-flash">gemini-2.5-flash</option>
          <option value="gemini-2.0-flash">gemini-2.0-flash</option>
          <option value="gemini-1.5-pro">gemini-1.5-pro</option>
          <option value="gemini-1.5-flash">gemini-1.5-flash</option>
        </select>
      </div>
    </div>

    <div>
      <div class="section-label">Statistics</div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="val" id="stat-rx">0</div>
          <div class="key">RX msgs</div>
        </div>
        <div class="stat-box">
          <div class="val" id="stat-tx">0</div>
          <div class="key">TX msgs</div>
        </div>
        <div class="stat-box">
          <div class="val" id="stat-err">0</div>
          <div class="key">Errors</div>
        </div>
        <div class="stat-box">
          <div class="val" id="stat-up">0s</div>
          <div class="key">Uptime</div>
        </div>
      </div>
    </div>

    <div style="margin-top:auto">
      <button class="btn" id="btn-clear" style="border-color:var(--dim);color:var(--dim)">✕ CLEAR LOG</button>
    </div>
  </aside>

  <div class="chat-wrap">
    <div id="log"></div>
    <div class="chat-footer">
      <div class="indicator" id="rx-indicator"></div>
      <span id="footer-text">Awaiting connection…</span>
    </div>
  </div>
</main>

<script>
// ── State ──────────────────────────────────────────────────────────────
let port = null, reader = null, writer = null;
let rxCount = 0, txCount = 0, errCount = 0;
let connectedAt = null, uptimeTimer = null;
let lineBuffer = '';

const $ = id => document.getElementById(id);

// ── UI helpers ──────────────────────────────────────────────────────────
function log(type, text) {
  const log = $('log');
  const div = document.createElement('div');
  div.className = `msg ${type}`;

  const tagMap = {
    device: ['DEVICE', 'tag-device'],
    gemini: ['GEMINI', 'tag-gemini'],
    system: ['SYSTEM', 'tag-system'],
    error:  ['ERROR',  'tag-error'],
  };
  const [label, cls] = tagMap[type] || ['INFO', 'tag-system'];
  const ts = new Date().toLocaleTimeString('en-US', { hour12: false });

  div.innerHTML = `
    <div class="msg-meta">
      <span class="tag ${cls}">${label}</span>
      <span>${ts}</span>
    </div>
    <div class="msg-body">${escHtml(text)}</div>
  `;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function showTyping() {
  const log = $('log');
  const div = document.createElement('div');
  div.className = 'msg gemini typing';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="msg-meta">
      <span class="tag tag-gemini">GEMINI</span>
      <span>thinking…</span>
    </div>
    <div class="msg-body"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  `;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function removeTyping() {
  const el = $('typing-indicator');
  if (el) el.remove();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function flash(id) {
  const el = $(id);
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), 200);
}

function setConnected(yes) {
  $('status-badge').textContent = yes ? 'CONNECTED' : 'DISCONNECTED';
  $('status-badge').className = yes ? 'connected' : '';
  $('btn-connect').disabled = yes;
  $('btn-disconnect').disabled = !yes;
  $('footer-text').textContent = yes ? 'Listening for serial data…' : 'Awaiting connection…';
  if (yes) {
    connectedAt = Date.now();
    uptimeTimer = setInterval(updateUptime, 1000);
  } else {
    clearInterval(uptimeTimer);
    $('stat-up').textContent = '0s';
  }
}

function updateUptime() {
  const s = Math.floor((Date.now() - connectedAt) / 1000);
  $('stat-up').textContent = s < 60 ? `${s}s` : `${Math.floor(s/60)}m`;
}

// ── Gemini ──────────────────────────────────────────────────────────────
async function askGemini(text) {
  const key   = $('apikey').value.trim();
  const model = $('model').value;
  const url   = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      system_instruction: {
        parts: [{
          text: "You are an assistant whose responses are displayed on a tiny calculator-style LCD screen with very limited space. Follow these rules strictly:\n1. Keep every response under 50 words.\n2. Use plain ASCII only — no emoji, no bullets, no dashes, no asterisks, no markdown, no special characters whatsoever.\n3. Write in short, plain sentences.\n4. Never use newlines or line breaks.\n5. If you cannot answer briefly, give the shortest possible summary."
        }]
      },
      contents: [{ parts: [{ text }] }]
    }),
  });

  if (!res.ok) throw new Error(`Gemini HTTP ${res.status}: ${await res.text()}`);
  const data = await res.json();
  return data.candidates[0].content.parts[0].text;
}

// ── Serial write ────────────────────────────────────────────────────────
async function writeSerial(text) {
  if (!writer) return;
  const chunkSize = parseInt($('chunk').value) || 63;
  const enc = new TextEncoder();
  for (let i = 0; i < text.length; i += chunkSize) {
    await writer.write(enc.encode(text.slice(i, i + chunkSize)));
  }
  txCount++;
  $('stat-tx').textContent = txCount;
}

// ── Serial read loop ────────────────────────────────────────────────────
async function readLoop() {
  const dec = new TextDecoder();
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      lineBuffer += dec.decode(value);
      let nl;
      while ((nl = lineBuffer.indexOf('\n')) !== -1) {
        const line = lineBuffer.slice(0, nl).replace(/\r$/, '').trim();
        lineBuffer = lineBuffer.slice(nl + 1);
        if (!line) continue;

        flash('rx-indicator');
        rxCount++;
        $('stat-rx').textContent = rxCount;
        log('device', line);

        showTyping();
        try {
          const reply = await askGemini(line);
          removeTyping();
          log('gemini', reply);
          await writeSerial(reply);
        } catch (e) {
          removeTyping();
          errCount++;
          $('stat-err').textContent = errCount;
          log('error', `Gemini error: ${e.message}`);
        }
      }
    }
  } catch (e) {
    if (!e.message.includes('cancelled') && !e.message.includes('closed')) {
      errCount++;
      $('stat-err').textContent = errCount;
      log('error', `Read error: ${e.message}`);
    }
  }
}

// ── Connect ─────────────────────────────────────────────────────────────
$('btn-connect').addEventListener('click', async () => {
  if (!('serial' in navigator)) {
    log('error', 'WebSerial is not supported in this browser. Use Chrome or Edge.');
    return;
  }
  try {
    port = await navigator.serial.requestPort();
    const baud = parseInt($('baud').value);
    await port.open({ baudRate: baud });

    writer = port.writable.getWriter();
    const readStream = port.readable;
    reader = readStream.getReader();

    // Send ack
    await writer.write(new TextEncoder().encode('ack\n'));

    setConnected(true);
    log('system', `Port opened @ ${baud} baud. Sent ACK. Waiting for messages…`);
    readLoop();
  } catch (e) {
    log('error', `Connection failed: ${e.message}`);
  }
});

// ── Disconnect ──────────────────────────────────────────────────────────
$('btn-disconnect').addEventListener('click', async () => {
  try {
    if (reader) { await reader.cancel(); reader.releaseLock(); reader = null; }
    if (writer) { writer.releaseLock(); writer = null; }
    if (port)   { await port.close();   port = null; }
  } catch(e) { /* ignore */ }
  lineBuffer = '';
  setConnected(false);
  log('system', 'Disconnected.');
});

$('btn-clear').addEventListener('click', () => { $('log').innerHTML = ''; });

// ── Init ────────────────────────────────────────────────────────────────
log('system', 'Ready. Select a serial port to begin.');
if (!('serial' in navigator)) {
  log('error', 'WebSerial API not available. Please use Chrome or Edge (desktop).');
}
</script>
</body>
</html>
